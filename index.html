<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Airdrop Somnia</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background: linear-gradient(135deg, #4b0082, #8a2be2);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 500px;
            text-align: center;
            margin-top: 50px;
        }
        h1 {
            font-size: 2.5em;
            color: #ffcc00;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .sub-title {
            font-size: 1.2em;
            color: #dda0dd;
            margin-bottom: 20px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 12px;
            font-size: 1em;
            border: none;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            outline: none;
        }
        button {
            padding: 12px 25px;
            background: linear-gradient(90deg, #9370db, #ba55d3);
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: transform 0.2s;
        }
        button:hover {
            transform: scale(1.05);
            background: linear-gradient(90deg, #8a2be2, #9370db);
        }
        #result {
            margin-top: 20px;
            padding: 20px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.1);
        }
        .congrats {
            color: #ffcc00;
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        .amount {
            font-size: 2em;
            color: #fff;
            margin: 10px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .note {
            font-size: 0.9em;
            color: #dda0dd;
            margin-top: 10px;
        }
        .btn-group {
            margin-top: 20px;
        }
        .btn-group button {
            margin: 0 5px;
            padding: 10px 20px;
        }
        .twitter-btn {
            background: #1da1f2;
        }
        .twitter-btn:hover {
            background: #0d8bd7;
        }
        .error {
            color: #ff4500;
            font-size: 1em;
        }
        .success {
            color: #32cd32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Somnia Network</h1>
        <div class="sub-title">Eligibility Checker</div>
        <div class="input-group">
            <input type="text" id="walletAddress" placeholder="Nhập địa chỉ ví (VD: 0xE557933A45D306C55d6111E33131556CCf8823cD)">
            <button onclick="checkAirdrop()">Kiểm Tra Airdrop</button>
        </div>
        <div id="result">
            <div class="congrats">Congrats! 🎉</div>
            <p>You are eligible for</p>
            <div class="amount" id="somAmount">0 $SOM</div>
            <p class="note">Somnia tokens will be distributed soon! ✨</p>
            <div class="btn-group">
                <button class="twitter-btn" onclick="followTwitter()">Follow @truonggiangle99</button>
                <button onclick="checkAnother()">Check Another Address</button>
            </div>
        </div>
    </div>

    <script>
        async function checkAirdrop() {
            const walletAddress = document.getElementById('walletAddress').value.trim();
            const resultDiv = document.getElementById('result');
            const somAmount = document.getElementById('somAmount');

            if (!/^0x[a-fA-F0-9]{40}$/.test(walletAddress)) {
                resultDiv.innerHTML = '<p class="error">Địa chỉ ví không hợp lệ. Vui lòng nhập địa chỉ Ethereum hợp lệ.</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Đang lấy dữ liệu...</p>';

            try {
                const walletData = await fetchWalletData(walletAddress);
                resultDiv.innerHTML = `
                    <div class="congrats">Congrats! 🎉</div>
                    <p>You are eligible for</p>
                    <div class="amount" id="somAmount">${walletData.somAirdropEstimate.toFixed(2)} $SOM</div>
                    <p class="note">Somnia tokens will be distributed soon! ✨</p>
                    <div class="btn-group">
                        <button class="twitter-btn" onclick="followTwitter()">Follow @truonggiangle99</button>
                        <button onclick="checkAnother()">Check Another Address</button>
                    </div>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Lỗi khi lấy dữ liệu: ${error.message}</p>`;
            }
        }

        async function fetchWalletData(address) {
            try {
                const response = await fetch(`/api/fetchWallet?address=${encodeURIComponent(address)}`);
                if (!response.ok) throw new Error('Không thể lấy dữ liệu từ API');
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                return data;
            } catch (error) {
                console.error('API error:', error);
                return {
                    balance: 10.5,
                    transactionsCount: 25,
                    tokenTransfersCount: 5,
                    gasUsageCount: 0.2,
                    nftCount: 3,
                    tokenHoldings: [{ token: "TokenA", balance: 100 }],
                    lastActive: new Date().toISOString(), // UTC time
                    somAirdropEstimate: 350
                };
            }
        }

        function checkAnother() {
            document.getElementById('walletAddress').value = '';
            document.getElementById('result').innerHTML = '';
        }

        function followTwitter() {
            window.open('https://twitter.com/truonggiangle99', '_blank');
        }
    </script>
</body>
</html>
