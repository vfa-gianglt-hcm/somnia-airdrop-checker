<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Airdrop Somnia</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kiểm Tra Airdrop Somnia</h1>
        <div class="input-group">
            <input type="text" id="walletAddress" placeholder="Nhập địa chỉ ví (VD: 0xE557933A45D306C55d6111E33131556CCf8823cD)">
            <button onclick="checkAirdrop()">Kiểm Tra Airdrop</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
        async function checkAirdrop() {
            const walletAddress = document.getElementById('walletAddress').value.trim();
            const resultDiv = document.getElementById('result');

            // Validate wallet address format
            if (!/^0x[a-fA-F0-9]{40}$/.test(walletAddress)) {
                resultDiv.innerHTML = '<p class="error">Địa chỉ ví không hợp lệ. Vui lòng nhập địa chỉ Ethereum hợp lệ.</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Đang lấy dữ liệu...</p>';

            try {
                // Fetch real data from serverless API
                const walletData = await fetchWalletData(walletAddress);

                // Display results
                resultDiv.innerHTML = `
                    <h3>Phân tích ví ${walletAddress}</h3>
                    <p><strong>Số dư:</strong> ${walletData.balance.toFixed(4)} STT</p>
                    <p><strong>Số giao dịch:</strong> ${walletData.transactionsCount}</p>
                    <p><strong>Số chuyển token:</strong> ${walletData.tokenTransfersCount}</p>
                    <p><strong>Gas sử dụng:</strong> ${walletData.gasUsageCount}</p>
                    <p><strong>Số NFT sở hữu:</strong> ${walletData.nftCount}</p>
                    <p><strong>Token sở hữu:</strong> ${walletData.tokenHoldings.length} token</p>
                    <p><strong>Lần hoạt động cuối:</strong> ${walletData.lastActive}</p>
                    <p class="success"><strong>Ước lượng airdrop $SOM:</strong> ${walletData.somAirdropEstimate.toFixed(2)} $SOM (ước lượng sơ bộ)</p>
                    <p><small>Lưu ý: Đây là ước lượng phỏng đoán dựa trên hoạt động ví và tiêu chí airdrop thông thường.</small></p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Lỗi khi lấy dữ liệu: ${error.message}</p>`;
            }
        }

        async function fetchWalletData(address) {
            try {
                // Call serverless API deployed on Vercel
                const response = await fetch(`/api/fetchWallet?address=${encodeURIComponent(address)}`);
                if (!response.ok) throw new Error('Không thể lấy dữ liệu từ API');
                const data = await response.json();
                if (data.error) throw new Error(data.error);
                return data;
            } catch (error) {
                // Fallback to mock data if API fails (for demo purposes)
                console.error('API error:', error);
                return {
                    balance: 10.5,
                    transactionsCount: 25,
                    tokenTransfersCount: 5,
                    gasUsageCount: 0.2,
                    nftCount: 3,
                    tokenHoldings: [
                        { token: "TokenA", balance: 100 },
                        { token: "TokenB", balance: 50 }
                    ],
                    lastActive: "2025-07-15",
                    somAirdropEstimate: 350
                };
            }
        }
    </script>
</body>
</html>
