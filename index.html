<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Somnia Airdrop Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f0f0;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 600px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .error {
            color: red;
        }
        .success {
            color: green;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Somnia Airdrop Checker</h1>
        <div class="input-group">
            <input type="text" id="walletAddress" placeholder="Enter wallet address (e.g., 0xDA1feA7873338F34C6915A44028aA4D9aBA1346B)">
            <button onclick="checkAirdrop()">Check Airdrop</button>
        </div>
        <div id="result"></div>
    </div>

    <script>
        async function checkAirdrop() {
            const walletAddress = document.getElementById('walletAddress').value.trim();
            const resultDiv = document.getElementById('result');

            // Validate wallet address format (basic check for 0x + 40 hex chars)
            if (!/^0x[a-fA-F0-9]{40}$/.test(walletAddress)) {
                resultDiv.innerHTML = '<p class="error">Invalid wallet address. Please enter a valid Ethereum address.</p>';
                return;
            }

            resultDiv.innerHTML = '<p>Fetching data...</p>';

            try {
                // Simulate fetching data from Somnia Testnet Explorer
                const walletData = await fetchWalletData(walletAddress);
                
                // Estimate airdrop based on data
                const airdropEstimate = estimateAirdrop(walletData);

                // Display results
                resultDiv.innerHTML = `
                    <h3>Wallet Analysis for ${walletAddress}</h3>
                    <p><strong>Balance:</strong> ${walletData.balance} STT</p>
                    <p><strong>Transactions:</strong> ${walletData.transactionCount}</p>
                    <p><strong>Token Holdings:</strong> ${walletData.tokenHoldings.length} tokens</p>
                    <p class="success"><strong>Estimated $SOM Airdrop:</strong> ${airdropEstimate} $SOM (rough estimate)</p>
                    <p><small>Note: This is a speculative estimate based on wallet activity and typical airdrop criteria.</small></p>
                `;
            } catch (error) {
                resultDiv.innerHTML = `<p class="error">Error fetching data: ${error.message}</p>`;
            }
        }

        async function fetchWalletData(address) {
            // Mock data fetching (replace with actual API calls or web scraping in production)
            // Simulating data from shannon-explorer.somnia.network
            return new Promise((resolve) => {
                setTimeout(() => {
                    // Mock data based on typical blockchain explorer response
                    resolve({
                        balance: 10.5, // Example: 10.5 STT (native token)
                        transactionCount: 25, // Example: 25 transactions
                        tokenHoldings: [
                            { token: "TokenA", balance: 100 },
                            { token: "TokenB", balance: 50 }
                        ], // Example token holdings
                        lastActive: "2025-07-15" // Example last activity
                    });
                }, 1000); // Simulate network delay
            });
        }

        function estimateAirdrop(walletData) {
            // Rough airdrop estimation logic (speculative)
            let baseAirdrop = 100; // Base airdrop for active wallets

            // Increase based on transaction count
            if (walletData.transactionCount > 50) {
                baseAirdrop += 500;
            } else if (walletData.transactionCount > 20) {
                baseAirdrop += 300;
            } else if (walletData.transactionCount > 5) {
                baseAirdrop += 100;
            }

            // Increase based on balance
            if (walletData.balance > 50) {
                baseAirdrop += 200;
            } else if (walletData.balance > 10) {
                baseAirdrop += 100;
            }

            // Increase based on token holdings
            baseAirdrop += walletData.tokenHoldings.length * 50;

            // Cap the estimate at a reasonable value
            return Math.min(baseAirdrop, 1000); // Max 1000 $SOM for estimation
        }
    </script>
</body>
</html>
